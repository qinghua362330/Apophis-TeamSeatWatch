name: Company Image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: company-image-main
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'qinghua362330/Apophis-TeamSeatWatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v6
        with:
          node-version: '24.21.0'
      - name: Install contract generators
        run: |
          set -euo pipefail
          go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.8.0
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
      - name: Verify source
        run: |
          set -euo pipefail
          export PATH="$HOME/go/bin:$PATH"
          corepack enable
          corepack install --global pnpm@12.4.2
          pnpm --dir web install --frozen-lockfile
          python3 tools/test-prepare-browser.py
          node tools/generate.mjs --check
          go test ./internal/cpaevent -count=1
          GOOS=linux GOARCH=amd64 go test -c -o /tmp/apophis-runtime.test ./internal/runtime
          GOOS=linux GOARCH=amd64 go vet ./...
          pnpm --dir web lint
          pnpm --dir web typecheck
          git diff --check
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: control-runtime
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/qinghua362330/apophis-teamseatwatch:control-sha-${{ github.sha }}
            ghcr.io/qinghua362330/apophis-teamseatwatch:control-main
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/qinghua362330/Apophis-TeamSeatWatch
            org.opencontainers.image.variant=control-runtime-no-browser
          cache-from: type=gha
          cache-to: type=gha,mode=max
