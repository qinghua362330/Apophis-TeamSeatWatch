name: Company Image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: company-image-main
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'qinghua362330/Apophis-TeamSeatWatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: apophis_test
          POSTGRES_PASSWORD: apophis_test
          POSTGRES_DB: apophis_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U apophis_test -d apophis_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TSW_TEST_DATABASE_URL: postgres://apophis_test:apophis_test@127.0.0.1:5432/apophis_test?sslmode=disable
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v6
        with:
          node-version: '24.21.0'
      - name: Install contract generators
        run: |
          set -euo pipefail
          go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.8.0
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
      - name: Verify source
        run: |
          set -euo pipefail
          export PATH="$HOME/go/bin:$PATH"
          corepack enable
          corepack install --global pnpm@12.4.2
          pnpm --dir web install --frozen-lockfile
          python3 tools/test-prepare-browser.py
          node tools/generate.mjs --check
          go test ./... -count=1 -timeout=120s
          go test -tags integration -count=1 ./internal/runtime -run 'CPA|OperationRemovalAdapter'
          go test -tags integration -count=1 ./internal/accountroute
          go test -tags integration -count=1 ./internal/accountsession
          go test -tags integration -count=1 ./internal/migrations -run CPA
          GOOS=linux GOARCH=amd64 go test -c -o /tmp/apophis-runtime.test ./internal/runtime
          GOOS=linux GOARCH=amd64 go vet ./...
          pnpm --dir web lint
          pnpm --dir web typecheck
          git diff --check
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        id: image
        with:
          context: .
          target: browser-runtime
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/qinghua362330/apophis-teamseatwatch:browser-sha-${{ github.sha }}
            ghcr.io/qinghua362330/apophis-teamseatwatch:browser-main
            ghcr.io/qinghua362330/apophis-teamseatwatch:control-sha-${{ github.sha }}
            ghcr.io/qinghua362330/apophis-teamseatwatch:control-main
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/qinghua362330/Apophis-TeamSeatWatch
            org.opencontainers.image.variant=browser-runtime
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test browser runtime without credentials
        run: |
          set -euo pipefail
          timeout 60s docker run --init --rm --memory=1g --cpus=1 --entrypoint /usr/bin/xvfb-run \
            ghcr.io/qinghua362330/apophis-teamseatwatch@${{ steps.image.outputs.digest }} \
            -a /opt/shardx/chrome --no-sandbox --headless --disable-gpu \
            --dump-dom 'data:text/html,<title>runtime-ok</title>' | grep 'runtime-ok'
